    fillRect(null,bx,by,fill,bh,"rgb(70,170,90)");
    strokeRect(null,bx,by,bw,bh,this.isDark?"rgb(140,200,255)":"rgb(0,0,0)",2);
    showText(`${this.respawnTimeLeft.toFixed(1)} сек`,W/2,353,this.isDark?"rgb(200,230,255)":"rgb(0,0,0)","20px Arial");
    fillRect(null,W/2-110,375,220,70,"rgb(70,170,90)");
    showText("Бесплатно",W/2,405,"rgb(255,255,255)","22px Arial");
    showText("пока что..",W/2,428,"rgb(230,230,230)","13px Arial");
    showText("ESC — пропустить",W/2,H-40,this.isDark?"rgb(160,200,240)":"rgb(80,80,80)","20px Arial");
  }
  if(this.state==="gameover"){
    if(this.isDark)drawDarkBg();else drawMenuBg(this.t||0);
    showText("ИГРА ОКОНЧЕНА",W/2,H/2-90,this.isDark?"rgb(255,150,150)":"rgb(0,0,0)","32px Arial");
    showText(`Ваш счет: ${this.score} м`,W/2,H/2-30,this.isDark?"rgb(220,240,255)":"rgb(0,0,0)","20px Arial");
    if(this.gameOverIsNew)showText(`Новый рекорд ${Math.max(this.mgHS,this.score)} м!`,W/2,H/2,"rgb(255,230,130)","20px Arial");
    else showText(`Лучший рекорд: ${Math.max(this.mgHS,this.score)} м`,W/2,H/2,"rgb(255,230,130)","20px Arial");
    showText("ПРОБЕЛ — начать заново",W/2,H/2+50,this.isDark?"rgb(130,230,150)":"rgb(50,200,50)","20px Arial");
    showText("ESC — в меню",W/2,H/2+80,this.isDark?"rgb(160,200,240)":"rgb(180,180,180)","20px Arial");
  }
};
MinigameScene.prototype.drawWorld=function(){
  ctx.fillStyle=this.isDark?"rgb(10,12,26)":rgb(BG);ctx.fillRect(0,0,W,H);
  if(!this.isDark){drawSun();for(const c of this.bgClouds)c.draw();}
  for(const p of this.platforms){
    if(this.isLava&&!this.isDark&&p.y>this.lavaY-4)continue;
    if(this.isVanish&&p.vanishFade!==null&&p.vanishFade!==undefined){
      ctx.globalAlpha=clamp(p.vanishFade/255,0,1);
      p.draw();ctx.globalAlpha=1;
    }else p.draw();
  }
  this.frog.draw();
  if(this.isLava){
    const top=this.lavaY|0;
    fillRect(null,0,top,W,H-top,"rgba(220,60,20,0.92)");
    fillRect(null,0,top,W,6,"rgb(255,140,30)");
    const tt=now()*0.002;
    for(let i=0;i<12;i++){const bx=(i*53+Math.floor(tt*30))%W;const by=top+10+Math.floor(8*Math.sin(tt*2+i));circle(null,bx,by,3,"rgba(255,200,80,0.78)");}
  }
  if(this.isDark){
    // фонарь
    const fuel=clamp(this.frog.lampFuelSeconds/MINIGAME_DARK_FUEL_SECONDS,0,1);
    if(fuel>0){
      const [lcx,lcy]=this.frog.getLampPos();
      const radius=MINIGAME_DARK_MIN_RADIUS+(MINIGAME_DARK_FUEL_FULL_RADIUS-MINIGAME_DARK_MIN_RADIUS)*fuel;
      const t=now()*0.004;
      const rw=radius*(1+0.035*Math.sin(t*1.6));
      // Затемнение через радиальный градиент
      const grad=ctx.createRadialGradient(lcx,lcy,rw*0.3,lcx,lcy,rw);
      grad.addColorStop(0,"rgba(0,0,0,0)");
      grad.addColorStop(0.5,"rgba(0,0,0,0.5)");
      grad.addColorStop(1,"rgba(0,0,0,0.96)");
      ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
      ctx.fillStyle="rgba(0,0,0,0.96)";
      ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(lcx,lcy,rw,0,Math.PI*2,true);ctx.fill();
    }else{
      ctx.fillStyle="rgba(0,0,0,0.96)";ctx.fillRect(0,0,W,H);
    }
    drawStarField(getStars(),now()*0.001);
    drawMoon();
  }
};

// ======================== ВЫБОР МИНИ-ИГРЫ ========================
function MinigamesMenuScene(){
  const cx=W/2;
  this.buttons=[
    new Button("1. ЛАВА",cx,170,280,58,[210,80,40]),
    new Button("2. НОЧЬ",cx,245,280,58,[60,70,120]),
    new Button("3. ИСЧЕЗАЮЩИЕ",cx,320,280,58,[120,90,160]),
  ];
  this.back=new TextLink("назад",cx,H-45,"20px Arial");
  this.t=0;this.result=null;
}
MinigamesMenuScene.prototype.update=function(dt){this.t+=dt/1000;for(const b of this.buttons)b.update(dt);this.back.update(dt);};
MinigamesMenuScene.prototype.onDown=function(x,y){for(const b of this.buttons)b.onDown(x,y);this.back.onDown(x,y);};
MinigamesMenuScene.prototype.onUp=function(x,y){for(const b of this.buttons)b.onUp(x,y);this.back.onUp(x,y);};
MinigamesMenuScene.prototype.onMove=function(x,y){for(const b of this.buttons)b.onMove(x,y);this.back.onMove(x,y);};
MinigamesMenuScene.prototype.draw=function(){
  drawMenuBg(this.t);
  showText("МИНИ ИГРЫ",W/2,80,"rgb(30,120,40)","34px Arial");
  for(const b of this.buttons)b.draw();
  const descs=["Лава поднимается и ускоряется.","Тёмная ночь: лампа гаснет — ищи топливо.","Каждая платформа исчезает после шага."];
  ctx.font="14px Arial";ctx.fillStyle="rgb(40,40,40)";ctx.textAlign="center";
  for(let i=0;i<3;i++)ctx.fillText(descs[i],W/2,170+i*75+40);
  this.back.draw();
  ctx.font="20px Arial";ctx.fillStyle="rgb(60,60,60)";ctx.fillText("ESC — назад",W/2,H-18);
};

// ======================== ГЛАВНЫЙ ЦИКЛ ========================
let sceneStack=[];
let lastTime=0;
let gameOverFade=0;

function goTo(scene){sceneStack.push(scene);currentScene=scene;}

function updateMain(dt){
  const sc=currentScene;
  if(!sc)return;
  // специальная обработка результатов
  if(sc instanceof MenuScene){
    if(sc.buttons[0].clicked){sc.buttons[0].clicked=false;goTo(new RunScene(0));return;}
    if(sc.buttons[1].clicked){sc.buttons[1].clicked=false;goTo(new LevelsScene());return;}
    if(sc.buttons[2].clicked){sc.buttons[2].clicked=false;goTo(new MinigamesMenuScene());return;}
    if(sc.buttons[3].clicked){sc.buttons[3].clicked=false;/* скины */return;}
    if(sc.buttons[4].clicked){sc.buttons[4].clicked=false;/* способности */return;}
    if(sc.howTo.clicked){sc.howTo.clicked=false;goTo(new HowToScene());return;}
    if(consumeKey("escape")){return;}
  }
  if(sc instanceof HowToScene){if(consumeKey("escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}}
  if(sc instanceof LevelsScene){
    if(consumeKey("escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
    for(let i=0;i<sc.buttons.length;i++){
      if(sc.buttons[i].clicked){
        sc.buttons[i].clicked=false;
        const levelNum=sc.page*sc.perPage+i+1;
        const completed=loadProgress(),unlocked=Math.min(WORKING_LEVELS,completed+1);
        if(levelNum<=WORKING_LEVELS&&levelNum<=unlocked){goTo(new RunScene(levelNum));return;}
      }
    }
  }
  if(sc instanceof MinigamesMenuScene){
    if(consumeKey("escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
    for(let i=0;i<sc.buttons.length;i++)if(sc.buttons[i].clicked){sc.buttons[i].clicked=false;goTo(new MinigameScene(["lava","dark","vanish"][i]));return;}
    if(sc.back.clicked){sc.back.clicked=false;sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
  }
  if(sc instanceof RunScene){
    if(sc.result==="retry"){sceneStack[sceneStack.length-1]=new RunScene(sc.levelNum);currentScene=sceneStack[sceneStack.length-1];return;}
    if(sc.result==="menu"){sceneStack.pop();sceneStack.pop();currentScene=sceneStack[sceneStack.length-1]||new MenuScene();if(!sceneStack.length)sceneStack.push(currentScene);return;}
    if(sc.result==="levels"){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
    if(sc.state==="victory"&&sc.victoryTime>0.5){
      if(consumeKey(" ")){const next=sc.levelNum+1;if(next<=WORKING_LEVELS){sceneStack[sceneStack.length-1]=new RunScene(next);currentScene=sceneStack[sceneStack.length-1];}else{sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];}return;}
      if(consumeKey("escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
      if(consumeKey("q")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
    }
  }
  if(sc instanceof MinigameScene){
    if(sc.result==="retry"){sceneStack[sceneStack.length-1]=new MinigameScene(sc.mode);currentScene=sceneStack[sceneStack.length-1];return;}
    if(sc.result==="menu"){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
  }
  sc.update(dt);
}

function loop(ts){
  const dt=Math.min(50,ts-lastTime);lastTime=ts;
  updateMain(dt);
  if(currentScene)currentScene.draw();
  requestAnimationFrame(loop);
}

// обработчики событий
window.addEventListener("mousemove",e=>{if(currentScene&&currentScene.onMove)currentScene.onMove(mouseX,mouseY);});
window.addEventListener("mousedown",e=>{
  if(currentScene&&currentScene.onDown)currentScene.onDown(mouseX,mouseY);
  if(currentScene&&currentScene instanceof MenuScene){
    if(currentScene.trophy.contains(mouseX,mouseY))currentScene.trophy.onDown(mouseX,mouseY);
  }
});
window.addEventListener("mouseup",e=>{
  if(currentScene&&currentScene.onUp)currentScene.onUp(mouseX,mouseY);
});
window.addEventListener("keydown",e=>{
  if(currentScene&&currentScene.keydown)currentScene.keydown(e);
});
// отдельная обработка перемещения по меню для кнопок
const origMove=window.onmousemove;
canvas.addEventListener("mousemove",()=>{
  if(currentScene instanceof MenuScene){
    for(const b of currentScene.buttons)b.onMove(mouseX,mouseY);
    currentScene.trophy.onMove(mouseX,mouseY);currentScene.howTo.onMove(mouseX,mouseY);
  }else if(currentScene instanceof MinigamesMenuScene){
    for(const b of currentScene.buttons)b.onMove(mouseX,mouseY);currentScene.back.onMove(mouseX,mouseY);
  }else if(currentScene&&currentScene instanceof LevelsScene){
    for(const b of currentScene.buttons)b.onMove(mouseX,mouseY);
  }
});

// старт
sceneStack.push(new MenuScene());
currentScene=sceneStack[0];
lastTime=performance.now();
requestAnimationFrame(loop);
</script>
