<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПрыжкоМания</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
  canvas{background:#aad2f5;box-shadow:0 0 30px #000;border-radius:6px}
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 400, H = 600;

/* ======================== КОНСТАНТЫ ======================== */
const WHITE=[255,255,255], BG=[170,210,245], GREEN=[50,200,50], BROWN=[139,69,19],
      BLACK=[0,0,0], ORANGE=[255,165,0], CLOUD=[240,248,255],
      GRAY=[180,180,180], STONE_DARK=[85,80,78], STONE_MID=[115,108,102],
      STONE_LIGHT=[155,148,140], STONE_HILITE=[185,178,170], TRAJ_COLOR=[70,70,85];

const TOTAL_LEVELS=50, WORKING_LEVELS=25;
const LEVEL_INTRO_FREEZE=13, LEVEL_INTRO_FREEZE_REPLACE=15, LEVEL_INTRO_DANGER=16,
      LEVEL_INTRO_SPIKE=22, LEVEL_INTRO_MOVING=19;

const MG_LAVA_START_SPEED=0.16, MG_LAVA_START_MULT=3.0, MG_LAVA_MAX_MULT=30,
      MG_LAVA_RAMP_MS=180000, MG_LAVA_GROWTH=1.12;
const MG_DARK_FUEL_FULL_RADIUS=170, MG_DARK_FUEL_EMPTY_RADIUS=26,
      MG_DARK_MIN_RADIUS=70, MG_DARK_FUEL_SECONDS=60.0,
      MG_DARK_REFUEL_SECONDS=25.0, MG_DARK_REFUEL_MIN_GAP=500,
      MG_DARK_REFUEL_MAX_GAP=800, MG_VANISH_DELAY_MS=700;

const MAX_PARTICLES_TOTAL=120, MAX_DANGER_PLATFORMS=3, MAX_CLOUD_PLATFORMS=3,
      DANGER_SAFE_GAP=78, REF_W=80.0, BASE_CLOUD_SPEED=0.26, MIN_CLOUD_SPEED=0.10,
      DIFFICULTY_MAX_SCORE=20000, BASE_MIN_GAP=65, BASE_MAX_GAP=85,
      FINAL_MIN_GAP=100, FINAL_MAX_GAP=125;
const MOVING_START_SCORE=4000, MOVING_REPLACE_CHANCE=0.10,
      MOVING_SPEED_MULT_AT_20K=3.0, MOVING_RANGE_MIN=40, MOVING_RANGE_MAX=65,
      BASE_MOVING_SPEED=1.5;
const SPIKE_START_SCORE=5000, SPIKE_H=13, MAX_RESPAWNS=3;
const FREEZE_REPLACE_START_SCORE=5000, FREEZE_REPLACE_CHANCE=0.08, SPRING_CHANCE=0.07;
const INFINITE_FREEZE_CHANCE=0.18, FLAT_DANGER_CHANCE=0.03, FLAT_SPIKE_CHANCE=0.05;
const SPRING_HIT_PAD=10;

/* ======================== УТИЛИТЫ ======================== */
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const choice=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const now=()=>performance.now();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function fillRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function strokeRect(x,y,w,h,c,lw=1){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h);}
function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function line(x1,y1,x2,y2,c,lw=1){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function poly(pts,c,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=c;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function roundRectPath(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function showText(text,x,y,color,font="20px Arial",center=true){
  ctx.font=font;ctx.textAlign=center?"center":"left";ctx.textBaseline="middle";
  ctx.fillStyle=color;ctx.fillText(text,x,y);
}
function outlinedText(text,x,y,color,outline,font="20px Arial"){
  ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle=outline;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)ctx.fillText(text,x+dx,y+dy);
  ctx.fillStyle=color;ctx.fillText(text,x,y);
}

/* ======================== СОХРАНЕНИЯ ======================== */
const HS_KEY="jumpmania_hs", PROG_KEY="jumpmania_prog";
const MG_KEY={lava:"jumpmania_hs_lava",dark:"jumpmania_hs_dark",vanish:"jumpmania_hs_vanish"};
function loadInt(k,d=0){try{const v=localStorage.getItem(k);return v?parseInt(v)||d:d;}catch(e){return d;}}
function saveInt(k,v){try{localStorage.setItem(k,String(v|0));}catch(e){}}
let highScore=loadInt(HS_KEY);
const loadProgress=()=>clamp(loadInt(PROG_KEY),0,TOTAL_LEVELS);
const saveProgress=v=>saveInt(PROG_KEY,v);
const loadMinigameHS=m=>MG_KEY[m]?loadInt(MG_KEY[m]):0;
const saveMinigameHS=(m,v)=>{if(MG_KEY[m])saveInt(MG_KEY[m],v);};

/* ======================== ФОН ======================== */
let _stars=null;
function getStars(){if(!_stars){_stars=[];for(let i=0;i<70;i++)_stars.push({x:randInt(0,W),y:randInt(0,H),r:choice([1,1,1,2])});}return _stars;}

function drawSun(){
  const cx=W-52,cy=52,t=now()*0.001;
  for(let i=0;i<12;i++){const a=t*0.6+i*(Math.PI*2/12);line(cx+Math.cos(a)*30,cy+Math.sin(a)*30,cx+Math.cos(a)*42,cy+Math.sin(a)*42,"rgb(255,210,80)",3);}
  for(let i=20;i>0;i--){const r=55*i/20,a=(4+6*(20-i)/20)/255;ctx.fillStyle=`rgba(255,220,100,${a})`;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();}
  circle(cx,cy,22,"rgb(255,200,60)");circle(cx-4,cy-4,16,"rgb(255,230,110)");
}
function drawMoon(){
  const cx=W-52,cy=52,R=240;
  for(let i=28;i>0;i--){const r=R*i/28,a=(2+3*((28-i)>>1))/255;ctx.fillStyle=`rgba(200,215,245,${a})`;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();}
  circle(cx,cy,22,"rgb(235,235,215)");circle(cx-5,cy-4,16,"rgb(255,255,240)");
  circle(cx+7,cy+3,4,"rgb(200,200,180)");circle(cx-8,cy+5,3,"rgb(205,205,185)");circle(cx+2,cy-8,2,"rgb(210,210,190)");
}
function drawStarField(stars,t){
  for(let i=0;i<stars.length;i++){const s=stars[i],tw=0.6+0.4*Math.sin(t*1.5+i);const a=clamp(120+120*tw,0,255)|0;ctx.fillStyle=`rgb(${a},${a},${Math.min(255,a+40)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
}
function drawDarkBg(){ctx.fillStyle="rgb(10,12,26)";ctx.fillRect(0,0,W,H);drawStarField(getStars(),now()*0.001);drawMoon();}
function drawCloudShape(x,y,w,h,c){
  const puffs=[[w*0.15,h*0.65,h*0.45],[w*0.35,h*0.40,h*0.55],[w*0.55,h*0.30,h*0.65],[w*0.75,h*0.40,h*0.55],[w*0.90,h*0.65,h*0.45],[w*0.25,h*0.55,h*0.55],[w*0.65,h*0.55,h*0.55]];
  ctx.fillStyle=c;ctx.fillRect(x+4,y+h/2,w-8,h/2);
  for(const [px,py,pr] of puffs)circle(x+px,y+py,pr,c);
}
function drawSnowflake(cx,cy,size,color){
  for(let i=0;i<6;i++){const ang=Math.PI/3*i;const ex=cx+Math.cos(ang)*size,ey=cy+Math.sin(ang)*size;line(cx,cy,ex,ey,color,1);
    for(const tt of [0.5,0.75]){const bx=cx+Math.cos(ang)*size*tt,by=cy+Math.sin(ang)*size*tt;for(const sd of [-1,1]){const ba=ang+sd*Math.PI/3;line(bx,by,bx+Math.cos(ba)*size*0.35,by+Math.sin(ba)*size*0.35,color,1);}}}
}
function drawTrophy(cx,cy,scale=1){
  const s=scale,gold="rgb(255,215,0)",goldD="rgb(180,130,10)",goldL="rgb(255,245,150)";
  const tW=28*s,bW=15*s,cH=24*s,tY=cy-16*s,bY=tY+cH;
  poly([[cx-tW/2,tY],[cx+tW/2,tY],[cx+bW/2,bY],[cx-bW/2,bY]],gold,goldD,Math.max(1,2*s));
  line(cx-tW/2+3*s,tY+2*s,cx-bW/2+2*s,bY-4*s,goldL,Math.max(1,2*s));
  const hr=7*s,ht=Math.max(2,3*s);
  ctx.strokeStyle=gold;ctx.lineWidth=ht;
  ctx.beginPath();ctx.arc(cx-tW/2-hr,tY+3*s+hr,hr,-Math.PI/2,Math.PI/2);ctx.stroke();
  ctx.beginPath();ctx.arc(cx+tW/2+hr,tY+3*s+hr,hr,Math.PI/2,3*Math.PI/2);ctx.stroke();
  const sw=5*s,sh=7*s;
  fillRect(cx-sw/2,bY,sw,sh,gold);
  const bw=20*s,bh=5*s,by2=bY+sh;
  fillRect(cx-bw/2,by2,bw,bh,gold);
  strokeRect(cx-bw/2,by2,bw,bh,goldD,Math.max(1,s));
  line(cx-bw/2+2*s,by2+s,cx+bw/2-2*s,by2+s,goldL,Math.max(1,s));
}
function drawStarIcon(cx,cy,r=8,fillC="rgb(255,220,70)",outline="rgb(160,110,10)"){
  const pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2===0?r:r*0.42;pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}
  poly(pts,fillC,outline,1);
}
function drawBrokenFlag(cx,cy,scale=1){
  const s=scale;const pt=[cx+12*s,cy-38*s],pb=[cx-8*s,cy+30*s];
  line(pb[0],pb[1],pt[0],pt[1],"rgb(90,90,90)",Math.max(2,5*s));
  circle(pt[0],pt[1],Math.max(2,3*s),"rgb(60,60,60)");
  const p1=pt,p2=[pt[0]+26*s,pt[1]+6*s],p3=[pt[0]+20*s,pt[1]+20*s],p4=[pt[0]+2*s,pt[1]+16*s];
  poly([p1,p2,p3,p4],"rgb(220,30,40)","rgb(90,20,25)",2);
  const q1=[pt[0]+14*s,pt[1]+30*s],q2=[pt[0]+36*s,pt[1]+38*s],q3=[pt[0]+30*s,pt[1]+48*s],q4=[pt[0]+14*s,pt[1]+42*s];
  poly([q1,q2,q3,q4],"rgb(180,25,35)","rgb(90,20,25)",2);
}

/* ======================== КНОПКИ ======================== */
class Button{
  constructor(text,cx,cy,w=220,h=55,base=[70,160,90]){
    this.text=text;this.x=cx-w/2;this.y=cy-h/2;this.w=w;this.h=h;this.base=base.slice();
    this.hoverC=base.map(c=>Math.min(255,c+45));this.pressC=base.map(c=>Math.max(0,c-40));
    this.hoverT=0;this.pressT=0;this.hovered=false;this.pressed=false;this.clicked=false;
  }
  contains(mx,my){return mx>=this.x&&mx<=this.x+this.w&&my>=this.y&&my<=this.y+this.h;}
  onMove(mx,my){this.hovered=this.contains(mx,my);}
  onDown(mx,my){if(this.contains(mx,my))this.pressed=true;}
  onUp(mx,my){if(this.pressed&&this.contains(mx,my))this.clicked=true;this.pressed=false;}
  update(dt){
    const th=this.hovered?1:0, tp=(this.pressed&&this.hovered)?1:0;
    this.hoverT+=(th-this.hoverT)*Math.min(1,dt/120*2.5);
    this.pressT+=(tp-this.pressT)*Math.min(1,dt/120*3.5);
  }
  reset(){this.hoverT=0;this.pressT=0;this.hovered=false;this.pressed=false;this.clicked=false;}
  draw(font="24px Arial"){
    const scale=1+0.06*this.hoverT-0.11*this.pressT;
    let col=lerp3(this.base,this.hoverC,this.hoverT);col=lerp3(col,this.pressC,this.pressT);
    const w=this.w*scale,h=this.h*scale;
    const x=this.x+this.w/2-w/2,y=this.y+this.h/2-h/2;
    const shOff=4+4*this.hoverT-4*this.pressT;
    ctx.fillStyle="rgba(0,0,0,0.35)";roundRectPath(x+2,y+shOff,w,h,12);ctx.fill();
    ctx.fillStyle=rgb(col);roundRectPath(x,y,w,h,12);ctx.fill();
    ctx.strokeStyle=rgb(lerp3([0,0,0],[255,255,255],this.hoverT*0.7));ctx.lineWidth=3;roundRectPath(x,y,w,h,12);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${0.18+0.16*this.hoverT})`;
    roundRectPath(x+4,y+4,w-8,h/2-4,10);ctx.fill();
    if(this.text){ctx.font=font;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="rgb(255,255,255)";ctx.fillText(this.text,x+w/2,y+h/2);}
    if(this.pressT>0.05){ctx.fillStyle=`rgba(255,255,255,${0.47*this.pressT})`;roundRectPath(x,y,w,h,12);ctx.fill();}
  }
}
class TextLink{
  constructor(text,cx,cy,font="20px Arial",color="rgb(0,0,0)",hover="rgb(70,70,70)"){
    this.text=text;this.x=cx;this.y=cy;this.font=font;this.color=color;this.hover=hover;
    this.hoverT=0;this.hovered=false;this.clicked=false;
  }
  getW(){ctx.font=this.font;return ctx.measureText(this.text).width;}
  contains(mx,my){const w=this.getW();return mx>=this.x-w/2&&mx<=this.x+w/2&&my>=this.y-10&&my<=this.y+10;}
  onMove(mx,my){this.hovered=this.contains(mx,my);}
  onDown(mx,my){if(this.contains(mx,my))this.clicked=true;}
  onUp(){}
  update(dt){const t=this.hovered?1:0;this.hoverT+=(t-this.hoverT)*Math.min(1,dt/80);}
  draw(){
    ctx.font=this.font;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=this.hoverT>0.5?this.hover:this.color;ctx.fillText(this.text,this.x,this.y);
    if(this.hoverT>0.5){const w=this.getW();line(this.x-w/2,this.y+11,this.x+w/2,this.y+11,this.hover,1);}
  }
}

/* ======================== КОНФЕТТИ ======================== */
const CONF_COLORS=[[255,80,80],[255,160,40],[255,230,60],[100,220,100],[60,180,255],[150,90,255],[255,100,200],[255,255,255],[255,200,100]];
class Confetti{
  constructor(x,y){
    this.x=x;this.y=y;this.vx=rand(-3.5,3.5);this.vy=rand(-9,-4);
    this.rot=rand(0,360);this.rotSpeed=rand(-12,12);
    this.w=randInt(3,6);this.h=randInt(2,4);this.color=choice(CONF_COLORS);
    this.life=randInt(1600,2600);this.maxLife=this.life;
    this.shape=choice(["rect","circle","strip"]);
    this.swayPhase=rand(0,Math.PI*2);this.swaySpeed=rand(0.05,0.12);
  }
  update(dt){
    const k=dt/16;this.vy+=0.28*k;this.swayPhase+=this.swaySpeed*k;
    this.x+=(this.vx+Math.sin(this.swayPhase)*0.6)*k;this.y+=this.vy*k;
    this.vx*=0.995;this.rot+=this.rotSpeed*k;this.life-=dt;
  }
  draw(){
    const a=clamp(Math.floor(255*this.life/this.maxLife),0,255);if(a<=0)return;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot*Math.PI/180);ctx.globalAlpha=a/255;ctx.fillStyle=rgb(this.color);
    if(this.shape==="circle"){ctx.beginPath();ctx.arc(0,0,this.w,0,Math.PI*2);ctx.fill();}
    else if(this.shape==="strip")ctx.fillRect(-this.w/2,-this.h*2,this.w,this.h*4);
    else ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);
    ctx.restore();ctx.globalAlpha=1;
  }
}
function spawnConfetti(list,cx,cy,count=90){
  for(let i=0;i<count;i++){const c=new Confetti(cx+rand(-8,8),cy+rand(-8,8));c.vx=rand(-5,5);c.vy=rand(-12,-3);list.push(c);}
}
function updateConfetti(list,dt){
  for(let i=list.length-1;i>=0;i--){const c=list[i];c.update(dt);if(c.life<=0||c.y>H+40){list.splice(i,1);continue;}c.draw();}
}

/* ======================== ЧАСТИЦЫ ======================== */
class Particle{
  constructor(x,y,vx,vy,r,life){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.r=r;this.life=life;this.maxLife=life;}
  update(dt){this.x+=this.vx*dt/16;this.y+=this.vy*dt/16;this.vy+=0.05*dt/16;this.vx*=0.98;this.life-=dt;}
  draw(){const a=clamp(Math.floor(255*this.life/this.maxLife),0,255);if(a<=0||this.r<0.5)return;ctx.fillStyle=`rgba(240,248,255,${a/255})`;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();}
}

/* ======================== ФОН-ОБЛАКА ======================== */
class BackgroundCloud{
  constructor(others){
    this.shape=choice(["classic","wide","tall","bumpy","huge"]);
    if(this.shape==="classic"){this.w=randInt(50,70);this.h=randInt(22,30);}
    else if(this.shape==="wide"){this.w=randInt(80,110);this.h=randInt(24,32);}
    else if(this.shape==="tall"){this.w=randInt(45,60);this.h=randInt(32,42);}
    else if(this.shape==="huge"){this.w=randInt(95,125);this.h=randInt(30,40);}
    else{this.w=randInt(60,80);this.h=randInt(22,30);}
    const ratio=REF_W/Math.max(20,this.w);
    this.spd=clamp(BASE_CLOUD_SPEED*Math.pow(ratio,1.4)*rand(0.92,1.08),MIN_CLOUD_SPEED,1.2);
    const sh=randInt(-15,30);
    this.color=[clamp(CLOUD[0]+sh,180,255),clamp(CLOUD[1]+sh,180,255),clamp(CLOUD[2]+sh,180,255)];
    this.x=0;this.y=0;this._place(others,true);
  }
  _place(others,initial){
    for(let k=0;k<25;k++){
      const x=randInt(-50,W);
      const y=initial?randInt(0,H-200):randInt(-120,-40);
      if(!others){this.x=x;this.y=y;return;}
      let ok=true;
      for(const o of others){if(o===this)continue;const mdx=(this.w+o.w)/2*0.85,mdy=(this.h+o.h)/2*0.85;if(Math.abs(x-o.x)<mdx&&Math.abs(y-o.y)<mdy){ok=false;break;}}
      if(ok){this.x=x;this.y=y;return;}
    }
    this.x=randInt(-50,W);this.y=initial?randInt(0,H-200):randInt(-120,-40);
  }
  update(dy,others){this.x+=this.spd;this.y+=dy*0.5;if(this.x>W||this.y>H)this._place(others,false);}
  draw(){drawCloudShape(this.x,this.y,this.w,this.h,rgb(this.color));}
}

/* ======================== ПЛАТФОРМЫ ======================== */
const RING_OFFSET=10;
function triangleFrac(phase){const t=phase%(2*Math.PI);if(t<Math.PI)return t/Math.PI;return 2-t/Math.PI;}
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

class Platform{
  constructor(x,y,type="normal",moveSpeedMult=1.0){
    this.x=x;this.y=y;this.w=70;this.h=15;this.type=type;
    this.springW=16;this.springX=0;this.springHitPad=0;
    if(type==="spring"){this.springX=randInt(6,this.w-6-this.springW);this.springHitPad=SPRING_HIT_PAD;}
    this.isStepped=false;this.timer=0;this.broken=false;
    this.fallOffset=0;this.fallVy=0;this.alpha=255;
    this.springAnim=0;this.electricT=0;this.particles=[];
    this.vanishFade=null;this.fuelTaken=false;
    this.baseX=x;this.prevX=x;this.moveRange=0;this.movePhase=0;this.moveSpeed=0;
    this.gearAngle=type==="moving"?rand(0,Math.PI*2):0;
    if(type==="moving"){this.movePhase=rand(0,Math.PI*2);this.moveSpeed=BASE_MOVING_SPEED*moveSpeedMult;}
  }
  springHitRect(){return {x:this.x+this.springX-this.springHitPad,y:this.y-16,w:this.springW+this.springHitPad*2,h:this.h+16};}
  spawnParticles(){
    for(let i=0;i<6;i++)this.particles.push(new Particle(this.x+rand(4,this.w-4),this.y+rand(2,this.h-2),rand(-1.2,1.2),rand(-1,0.5),rand(5,8),randInt(500,700)));
  }
  update(dt){
    this.prevX=this.x;
    if(this.type==="moving"){
      this.movePhase+=this.moveSpeed*dt/1000;
      const f=triangleFrac(this.movePhase);this.x=this.baseX+(f*2-1)*this.moveRange;
      this.gearAngle+=(this.x-this.prevX)*0.1;
    }
    if(this.type==="break"&&this.isStepped&&!this.broken){this.timer+=dt;if(this.timer>=300)this.broken=true;}
    if(this.type==="break"&&this.broken){this.fallVy+=0.5;this.fallOffset+=this.fallVy;this.alpha=Math.max(0,this.alpha-8);}
    if(this.type==="cloud"&&this.broken){for(const p of this.particles)p.update(dt);this.particles=this.particles.filter(p=>p.life>0&&p.r>=0.5);}
    if(this.springAnim>0)this.springAnim=Math.max(0,this.springAnim-dt/150);
    else if(this.springAnim<0)this.springAnim=Math.min(0,this.springAnim+dt/100);
    if(this.type==="danger")this.electricT+=dt;
  }
  draw(){
    if(this.broken&&this.type!=="break"&&this.type!=="cloud")return;
    switch(this.type){
      case "normal": this.drawGround(); break;
      case "fuel": this.drawGround(); if(!this.fuelTaken)drawFuelCan(this.x+this.w/2,this.y-1); break;
      case "spring": this.drawGround(); this.drawSpring(); break;
      case "freeze": this.drawFreeze(); break;
      case "cloud": this.drawCloud(); break;
      case "danger": this.drawDanger(); break;
      case "moving": this.drawMoving(); break;
      case "spike": this.drawSpike(); break;
      case "break": this.drawBreak(); break;
    }
  }
  drawGround(){
    fillRect(this.x,this.y,this.w,this.h,"rgb(115,75,45)");
    fillRect(this.x,this.y,this.w,7,"rgb(60,195,60)");
    line(this.x+2,this.y+7,this.x+this.w-2,this.y+7,"rgb(35,130,35)",1);
    for(let i=0;i<this.w;i+=5){const bx=this.x+i+2,gh=2+((i/5|0)%3);line(bx,this.y+1,bx,this.y+1-gh,"rgb(90,230,90)",1);}
    for(let i=0;i<this.w;i+=12){const dx=this.x+i+6,dy=this.y+10+((i/12|0)%2);fillRect(dx,dy,3,2,"rgb(90,55,30)");}
  }
  drawSpring(){
    const sx=this.x+this.springX,cx=sx+this.springW/2;
    const coilH=Math.max(3,12*(1-this.springAnim*0.4));
    const topY=this.y-coilH;
    for(let i=0;i<3;i++){const y=this.y-2-i*(coilH/2);line(cx-6,y,cx+6,y,"rgb(235,235,235)",2);}
    fillRect(cx-8,topY-3,16,3,"rgb(255,255,255)");
  }
  drawFreeze(){
    fillRect(this.x,this.y,this.w,this.h,"rgb(185,225,255)");
    strokeRect(this.x,this.y,this.w,this.h,"rgb(100,180,240)",2);
    const cy=this.y+this.h/2;
    for(const sx of [this.x+14,this.x+35,this.x+56])drawSnowflake(sx,cy,5,"rgb(250,255,255)");
  }
  drawCloud(){
    if(this.broken){for(const p of this.particles)p.draw();return;}
    fillRect(this.x,this.y,this.w,this.h,rgb(CLOUD));
    strokeRect(this.x,this.y,this.w,this.h,"rgb(200,215,235)",1);
    const sp=[[this.x+2,this.y+4,6],[this.x+1,this.y+10,5],[this.x-2,this.y+8,5],[this.x+this.w-2,this.y+4,6],[this.x+this.w-1,this.y+10,5],[this.x+this.w+2,this.y+8,5]];
    for(const [px,py,r] of sp){circle(px,py,r,rgb(CLOUD));ctx.strokeStyle="rgb(200,215,235)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.stroke();}
  }
  drawDanger(){
    fillRect(this.x,this.y,this.w,this.h,"rgb(80,65,150)");
    strokeRect(this.x,this.y,this.w,this.h,"rgb(140,210,255)",2);
    const cx=this.x+this.w/2,cy=this.y+this.h/2+1;
    poly([[cx,cy-6],[cx-6,cy+4],[cx+6,cy+4]],"rgba(230,240,255,0.35)","rgba(200,230,255,0.78)",1);
    fillRect(cx-1,cy-3,2,4,"rgb(230,240,255)");fillRect(cx-1,cy+2,2,1,"rgb(230,240,255)");
    const seed=Math.floor(this.electricT/70);
    const pts=this._genWrapPoints(RING_OFFSET,seed*41+(this.x|0));
    ctx.strokeStyle="rgba(150,220,255,0.43)";ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(this.x+pts[0][0],this.y+pts[0][1]);
    for(const p of pts)ctx.lineTo(this.x+p[0],this.y+p[1]);ctx.stroke();
    ctx.strokeStyle="rgba(220,240,255,0.78)";ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(this.x+pts[0][0],this.y+pts[0][1]);
    for(const p of pts)ctx.lineTo(this.x+p[0],this.y+p[1]);ctx.stroke();
    ctx.strokeStyle="rgb(255,255,255)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(this.x+pts[0][0],this.y+pts[0][1]);
    for(const p of pts)ctx.lineTo(this.x+p[0],this.y+p[1]);ctx.stroke();
  }
  _genWrapPoints(offset,seed){
    let s=seed>>>0;
    const rnd=()=>{s=(s*1664525+1013904223)>>>0;return (s&0x7fffffff)/0x7fffffff;};
    const x1=-offset,y1=-offset,x2=this.w+offset,y2=this.h+offset;
    const wps=[[x1,y1],[x2,y1],[x2,y2],[x1,y2],[x1,y1]];
    const pts=[];
    for(let i=0;i<wps.length-1;i++){
      const [ax,ay]=wps[i],[bx,by]=wps[i+1];
      const dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
      for(let j=0;j<8;j++){const t=j/8;const px=ax+dx*t,py=ay+dy*t;const zig=Math.sin(t*Math.PI)*(rnd()*8-4)+(rnd()*3-1.5);pts.push([px+nx*zig,py+ny*zig]);}
    }
    pts.push(wps[wps.length-1]);
    return pts;
  }
  drawMoving(){
    const tx1=this.baseX-this.moveRange-4,tx2=this.baseX+this.moveRange+this.w+4,ty=this.y+this.h/2;
    line(tx1,ty,tx2,ty,"rgba(70,70,85,0.7)",1);
    line(tx1,ty-3,tx1,ty+3,"rgba(70,70,85,0.7)",1);
    line(tx2,ty-3,tx2,ty+3,"rgba(70,70,85,0.7)",1);
    fillRect(this.x,this.y,this.w,this.h,"rgb(115,108,102)");
    strokeRect(this.x,this.y,this.w,this.h,"rgb(85,80,78)",1);
    line(this.x+3,this.y+2,this.x+this.w-3,this.y+2,"rgb(185,178,170)",1);
    for(let i=0;i<this.w;i+=14){fillRect(this.x+i+4,this.y+6,4,2,"rgb(85,80,78)");fillRect(this.x+i+8,this.y+11,3,1,"rgb(155,148,140)");}
    this._drawGear(this.x+6,this.y+this.h+5,this.gearAngle);
    this._drawGear(this.x+this.w-6,this.y+this.h+5,-this.gearAngle);
  }
  _drawGear(cx,cy,ang){
    const r=5;ctx.save();ctx.translate(cx,cy);
    ctx.strokeStyle="rgb(85,80,78)";ctx.lineWidth=3;
    for(let i=0;i<8;i++){const a=ang+i*(Math.PI*2/8);ctx.beginPath();ctx.moveTo(Math.cos(a)*(r-1),Math.sin(a)*(r-1));ctx.lineTo(Math.cos(a)*(r+3),Math.sin(a)*(r+3));ctx.stroke();}
    circle(0,0,r,"rgb(115,108,102)");circle(-1,-1,r-1,"rgb(155,148,140)");
    ctx.strokeStyle="rgb(85,80,78)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
    circle(0,0,2,"rgb(85,80,78)");circle(-1,-1,1,"rgb(185,178,170)");
    ctx.restore();
  }
  drawSpike(){
    fillRect(this.x,this.y,this.w,this.h,"rgb(115,108,102)");
    strokeRect(this.x,this.y,this.w,this.h,"rgb(85,80,78)",1);
    line(this.x+3,this.y+2,this.x+this.w-3,this.y+2,"rgb(185,178,170)",1);
    this._drawSpikeRow(this.y-(SPIKE_H-1),false);
    this._drawSpikeRow(this.y+this.h-1,true);
  }
  _drawSpikeRow(baseY,flip){
    const n=6,step=this.w/n;
    for(let i=0;i<n;i++){
      const bx=this.x+i*step+step/2,half=step*0.38;
      const pts=flip?[[bx-half,baseY],[bx,baseY+SPIKE_H-1],[bx+half,baseY]]:[[bx-half,baseY+SPIKE_H],[bx,baseY+1],[bx+half,baseY+SPIKE_H]];
      poly(pts,"rgb(200,200,210)","rgb(90,90,100)",1);
    }
  }
  drawBreak(){
    if(this.broken){
      if(this.alpha<=0)return;
      const pw=this.w/2,angle=Math.min(this.fallOffset*1.2,75);
      ctx.save();ctx.globalAlpha=this.alpha/255;
      ctx.translate(this.x+pw/2,this.y+this.h/2+this.fallOffset);ctx.rotate(-angle*Math.PI/180);
      ctx.fillStyle=rgb(BROWN);ctx.fillRect(-pw/2,-this.h/2,pw,this.h);ctx.restore();
      ctx.save();ctx.globalAlpha=this.alpha/255;
      ctx.translate(this.x+this.w-pw/2,this.y+this.h/2+this.fallOffset*0.9);ctx.rotate(angle*Math.PI/180);
      ctx.fillStyle=rgb(BROWN);ctx.fillRect(-pw/2,-this.h/2,pw,this.h);ctx.restore();
      ctx.globalAlpha=1;
    }else{
      fillRect(this.x,this.y,this.w,this.h,rgb(BROWN));
      line(this.x+2,this.y,this.x+this.w-2,this.y,"rgb(90,45,15)",1);
      line(this.x+2,this.y+this.h-1,this.x+this.w-2,this.y+this.h-1,"rgb(60,30,10)",1);
      for(let i=1;i<4;i++)line(this.x+3,this.y+i*(this.h/4),this.x+this.w-3,this.y+i*(this.h/4),"rgb(105,60,30)",1);
      line(this.x+4,this.y+2,this.x+this.w-4,this.y+2,"rgb(160,100,55)",1);
      const cx=this.x+this.w/2;
      line(cx,this.y+1,cx-2,this.y+this.h/3,"rgb(40,20,5)",1);
      line(cx-2,this.y+this.h/3,cx+2,this.y+2*this.h/3,"rgb(40,20,5)",1);
      line(cx+2,this.y+2*this.h/3,cx,this.y+this.h-1,"rgb(40,20,5)",1);
    }
  }
}
function drawFuelCan(cx,cy){
  const w=18,h=14,x=cx-w/2,y=cy-h;
  fillRect(x,y,w,h,"rgb(190,50,40)");strokeRect(x,y,w,h,"rgb(90,20,15)",1);
  line(x+2,y+2,x+2,y+h-2,"rgb(240,120,100)",1);
  fillRect(x+w-6,y-3,5,4,"rgb(60,60,60)");
  circle(cx,cy-h/2-1,3,"rgb(255,220,120)");

}
class FinishPlatform extends Platform{
  constructor(x,y){super(x,y,"finish");this.w=90;this.h=20;}
  draw(){
    const cell=10;
    for(let r=0;r<Math.ceil(this.h/cell);r++)for(let c=0;c<Math.floor(this.w/cell);c++)
      fillRect(this.x+c*cell,this.y+r*cell,cell,cell,(r+c)%2===0?"rgb(255,255,255)":"rgb(25,25,30)");
    strokeRect(this.x,this.y,this.w,this.h,"rgb(40,40,40)",2);

/* ======================== ЛЯГУШКА ======================== */
class Frog{
  constructor(){
    this.w=30;this.h=30;this.x=W/2-15;this.y=H-130;
    this.vy=0;this.gravity=0.5;this.jumpPower=-13;
    this.jumpsLeft=1;this.abilityActive=false;this.abilityTimer=0;this.cooldown=0;
    this.springTimer=0;this.springPlatform=null;this.freezeTimer=0;
    this.dying=false;this.deathTimer=0;this.standingPlatform=null;this.standingOffsetX=0;
    this.deathKind=null;this.knockbackVx=0;this.knockbackVy=0;
    this.hasLamp=false;this.lampOffset=22;this.lampTargetOffset=22;this.lampY=-6;
    this.lampFuelSeconds=MG_DARK_FUEL_SECONDS;
  }
  move(){
    const speed=this.freezeTimer>0?5/1.3:5;
    const left=keys["left"],right=keys["right"];
    if(this.hasLamp){
      if(left&&!right)this.lampTargetOffset=-22;
      else if(right&&!left)this.lampTargetOffset=22;
      this.lampOffset+=(this.lampTargetOffset-this.lampOffset)*0.25;
    }
    if(left)this.x-=speed;
    if(right)this.x+=speed;
    if(this.x<-this.w)this.x=W;
    else if(this.x>W)this.x=-this.w;
    this.vy+=this.gravity;this.y+=this.vy;
  }
  getLampPos(){return [this.x+this.w/2+this.lampOffset,this.y+this.h/2+this.lampY];}
  jump(power){
    let p=power!==undefined?power:this.jumpPower;
    if(this.freezeTimer>0)p/=1.3;
    this.vy=p;this.standingPlatform=null;this.standingOffsetX=0;
  }
  updateTimers(dt){
    if(this.freezeTimer>0)this.freezeTimer=Math.max(0,this.freezeTimer-dt);
    if(this.abilityActive){this.abilityTimer-=dt;if(this.abilityTimer<=0){this.abilityActive=false;this.cooldown=15000;}}
    else if(this.cooldown>0)this.cooldown=Math.max(0,this.cooldown-dt);
    if(this.springTimer>0){
      this.springTimer-=dt;
      if(this.springTimer<=0){
        this.springTimer=0;
        if(this.springPlatform){this.springPlatform.springAnim=-1;this.springPlatform=null;}
        this.jump(-32);
      }
    }
  }
  activateAbility(){if(!this.abilityActive&&this.cooldown===0){this.abilityActive=true;this.abilityTimer=5000;this.jumpsLeft=2;}}
  startDeath(kind,impactFrom){
    if(!["electric","spike","fall"].includes(kind))kind="electric";
    this.dying=true;this.deathKind=kind;this.standingPlatform=null;this.standingOffsetX=0;this.abilityActive=false;
    if(kind==="spike"){
      if(impactFrom){
        const [px,py]=impactFrom,cx=this.x+this.w/2,cy=this.y+this.h/2;
        const dx=cx-px,dy=cy-py,L=Math.hypot(dx,dy)||1,nx=dx/L,ny=dy/L;
        this.knockbackVx=nx*6+rand(-1.5,1.5);this.knockbackVy=-9-rand(0,2);
        if(ny<-0.3)this.knockbackVy-=2;
      }else{this.knockbackVx=rand(-5,5);this.knockbackVy=-10;}
      this.deathTimer=1500;
    }else if(kind==="fall"){this.deathTimer=300;this.knockbackVx=0;this.knockbackVy=4;}
    else{this.deathTimer=900;this.knockbackVx=0;this.knockbackVy=0;}
  }
  updateDeath(dt){
    if(this.deathKind==="spike"){
      this.knockbackVy+=0.4*dt/16;this.x+=this.knockbackVx*dt/16;this.y+=this.knockbackVy*dt/16;this.knockbackVx*=0.995;
      if(this.x<-this.w*2){this.x=-this.w*2;this.knockbackVx=Math.abs(this.knockbackVx)*0.5;}
      else if(this.x>W+this.w){this.x=W+this.w;this.knockbackVx=-Math.abs(this.knockbackVx)*0.5;}
    }else if(this.deathKind==="fall"){this.knockbackVy+=0.8*dt/16;this.y+=this.knockbackVy*dt/16;}
  }
  drawBody(x,y,w,h){
    ctx.fillStyle="rgb(30,150,30)";
    ctx.beginPath();ctx.ellipse(x-2,y+h-4,6,4,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+w-2,y+h-4,6,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=rgb(GREEN);ctx.beginPath();ctx.ellipse(x+w/2,y+h/2+1,w/2,h/2-1,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgb(120,225,120)";ctx.beginPath();ctx.ellipse(x+w/2,y+h/2+7,w/2-6,h/2-7,0,0,Math.PI*2);ctx.fill();
    circle(x+8,y+4,6,rgb(GREEN));circle(x+w-8,y+4,6,rgb(GREEN));
    circle(x+8,y+4,4,"rgb(255,255,255)");circle(x+w-8,y+4,4,"rgb(255,255,255)");
    circle(x+9,y+5,2,"rgb(0,0,0)");circle(x+w-9,y+5,2,"rgb(0,0,0)");
    circle(x+10,y+4,1,"rgb(255,255,255)");circle(x+w-8,y+4,1,"rgb(255,255,255)");
    ctx.strokeStyle="rgb(20,90,20)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x+w/2,y+13,w/2-8,0,Math.PI);ctx.stroke();
  }
  drawLamp(cx,cy){
    const fuel=clamp(this.lampFuelSeconds/MG_DARK_FUEL_SECONDS,0,1);
    if(fuel>0){
      const t=now()*0.004;
      const R=(8+22*fuel)*(1+0.05*Math.sin(t*1.7)+0.025*Math.sin(t*3.1));
      for(let i=1;i<=10;i++){const r=R*i/10,a=(10+30*fuel)*(1-i/10);ctx.fillStyle=`rgba(255,210,120,${a/255})`;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();}
    }
    const tilt=this.lampOffset>0?4:this.lampOffset<0?-4:0;
    fillRect(cx-7,cy+10,14,4,"rgb(110,80,40)");
    fillRect(cx-6,cy+3,12,8,"rgb(200,150,60)");
    strokeRect(cx-6,cy+3,12,8,"rgb(120,80,25)",1);
    poly([[cx-5,cy+3],[cx-4,cy-8],[cx+4,cy-8],[cx+5,cy+3]],"rgb(255,200,90)","rgb(120,80,25)",1);
    if(fuel>0.02){
      const t=now()*0.01,flick=Math.sin(t)*1.2*fuel,fh=4+6*fuel,fcx=cx+tilt*0.2,fcy=cy-4;
      poly([[fcx+flick,fcy-fh],[fcx-3*fuel,fcy+1],[fcx+3*fuel,fcy+1]],"rgb(255,170,40)");
      poly([[fcx+flick*0.5,fcy-fh*0.6],[fcx-1.5*fuel,fcy+1],[fcx+1.5*fuel,fcy+1]],"rgb(255,240,180)");
    }
    fillRect(cx-4,cy-11,8,3,"rgb(90,70,40)");
    ctx.strokeStyle="rgb(90,70,40)";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx+tilt,cy-13,6,Math.PI,Math.PI*2);ctx.stroke();
  }
  draw(){
    const x=this.x,y=this.y,w=this.w,h=this.h;
    if(this.dying&&this.deathKind==="spike"){
      ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(now()*0.35*Math.PI/180);ctx.translate(-w/2,-h/2);
      this.drawBody(0,0,w,h);ctx.restore();
      return;
    }
    this.drawBody(x,y,w,h);
    if(this.dying)return;
    const t=now()*0.005;
    if(this.hasLamp){const [lcx,lcy]=this.getLampPos();this.drawLamp(lcx,lcy);}
    if(this.abilityActive){
      const pulse=1+0.12*Math.sin(t*2),R=22*pulse;
      for(let i=1;i<=6;i++){const r=R*i/6,a=80*(1-i/7);ctx.fillStyle=`rgba(255,210,60,${a/255})`;ctx.beginPath();ctx.arc(x+w/2,y+h/2,r,0,Math.PI*2);ctx.fill();}
      for(let i=0;i<5;i++){const a=t*1.5+i*(Math.PI*2/5);circle(x+w/2+Math.cos(a)*(R+2),y+h/2+Math.sin(a)*(R+2)*0.7,2,"rgb(255,240,130)");}
    }
    if(this.freezeTimer>0){
      const inten=Math.min(1,this.freezeTimer/1000);
      ctx.fillStyle=`rgba(190,230,255,${0.6*inten})`;ctx.fillRect(x-2,y-2,w+4,h+4);
      strokeRect(x-2,y-2,w+4,h+4,"rgb(200,235,255)",2);
      for(const [ox,oy] of [[5,5],[w-5,5],[5,h-5],[w-5,h-5]])drawSnowflake(x+ox,y+oy,4,"rgb(245,250,255)");
    }
  }
  drawElectricDeath(){
    this.draw();
    const x=this.x,y=this.y,w=this.w,h=this.h,cx=x+w/2,cy=y+h/2,t=now();
    const flick=(Math.floor(t/60)%2)===0;
    ctx.fillStyle=flick?"rgba(230,245,255,0.6)":"rgba(120,200,255,0.6)";
    ctx.beginPath();ctx.ellipse(cx,cy,w/2+2,h/2+2,0,0,Math.PI*2);ctx.fill();
    for(let i=0;i<8;i++){
      const a=(t*0.001+i*Math.PI/4)%(Math.PI*2),dist=w*0.9;
      const sx=cx+Math.cos(a)*(dist*0.4),sy=cy+Math.sin(a)*(dist*0.4),ex=cx+Math.cos(a)*dist,ey=cy+Math.sin(a)*dist;
      const mx=(sx+ex)/2+rand(-5,5),my=(sy+ey)/2+rand(-5,5);
      ctx.strokeStyle="rgb(150,220,255)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(mx,my);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.strokeStyle="rgb(255,255,255)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(mx,my);ctx.lineTo(ex,ey);ctx.stroke();
    }
  }
  drawSpikeHit(){
    this.draw();
    if(this.deathTimer>1000){
      for(let i=0;i<6;i++){const a=rand(0,Math.PI*2),d=rand(6,18);circle(this.x+this.w/2+Math.cos(a)*d,this.y+this.h/2+Math.sin(a)*d,rand(1,2),Math.random()<0.5?"rgb(255,90,90)":"rgb(255,220,120)");}

const keys={left:false,right:false,jump:false};
let mouseX=0,mouseY=0;
const pressedKeys={};   // edge-triggered: e.code -> true

// Физическая клавиша (e.code) — не зависит от раскладки!
function codeToAction(code){
  if(code==="KeyA"||code==="ArrowLeft")return "left";
  if(code==="KeyD"||code==="ArrowRight")return "right";
  if(code==="KeyW"||code==="ArrowUp")return "jump";
  return null;
}
window.addEventListener("keydown",e=>{
  const action=codeToAction(e.code);
  if(action){keys[action]=true;e.preventDefault();}
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="ArrowDown"||e.code==="ArrowLeft"||e.code==="ArrowRight")e.preventDefault();
  if(!e.repeat)pressedKeys[e.code]=true;
  if(currentScene&&currentScene.keydown)currentScene.keydown(e);
});
window.addEventListener("keyup",e=>{
  const action=codeToAction(e.code);
  if(action)keys[action]=false;
  pressedKeys[e.code]=false;
});
function consumeKey(code){if(pressedKeys[code]){pressedKeys[code]=false;return true;}return false;}

canvas.addEventListener("mousemove",e=>{
  const r=canvas.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);mouseY=(e.clientY-r.top)*(H/r.height);
  if(currentScene&&currentScene.onMove)currentScene.onMove(mouseX,mouseY);
});
canvas.addEventListener("mousedown",e=>{if(e.button===0&&currentScene&&currentScene.onDown)currentScene.onDown(mouseX,mouseY);});
canvas.addEventListener("mouseup",e=>{if(e.button===0&&currentScene&&currentScene.onUp)currentScene.onUp(mouseX,mouseY);});

/* ======================== ЛОГИКА ======================== */
function platformGapRange(score){
  const t=Math.min(1,score/DIFFICULTY_MAX_SCORE);
  let mn=Math.floor(BASE_MIN_GAP+(FINAL_MIN_GAP-BASE_MIN_GAP)*t);
  let mx=Math.floor(BASE_MAX_GAP+(FINAL_MAX_GAP-BASE_MAX_GAP)*t);
  mn=Math.min(mn,130);mx=Math.min(mx,140);
  return [mn,mx];
}
function dangerChance(s){if(s<3000)return 0;if(s<4000)return 0.03;if(s>=20000)return 0.20;return 0.03+0.17*((s-4000)/16000);}
function spikeChance(s){if(s<SPIKE_START_SCORE)return 0;if(s>=20000)return 0.30;return 0.05+0.25*((s-SPIKE_START_SCORE)/15000);}
function movingSpeedMult(s){if(s<MOVING_START_SCORE)return 1;if(s>=DIFFICULTY_MAX_SCORE)return MOVING_SPEED_MULT_AT_20K;const t=(s-MOVING_START_SCORE)/(DIFFICULTY_MAX_SCORE-MOVING_START_SCORE);return 1+(MOVING_SPEED_MULT_AT_20K-1)*t;}
function freezeReplaceChance(s){return s<FREEZE_REPLACE_START_SCORE?0:FREEZE_REPLACE_CHANCE;}
function countType(pl,t){return pl.filter(p=>p.type===t&&!p.broken).length;}
function totalParticles(pl){return pl.reduce((s,p)=>s+(p.type==="cloud"?p.particles.length:0),0);}
function overlapsVertical(p,y,h,mg=6){return !(y+h+mg<p.y||y>p.y+p.h+mg);}
function findFreeX(pl,y,w,h,tries=40,extra=4){
  const cand=[];for(let x=0;x<Math.max(1,W-w+1);x+=5)cand.push(x);shuffle(cand);
  for(let i=0;i<Math.min(tries,cand.length);i++){
    const x=cand[i];let ok=true;
    for(const p of pl){if(p.broken)continue;if(!overlapsVertical(p,y,h,extra))continue;if(x<p.x+p.w&&x+w>p.x){ok=false;break;}}
    if(ok)return x;
  }
  return null;
}
function isDangerSafe(x,y,pl,w=70,h=15,minGap=DANGER_SAFE_GAP,hm=25){
  for(const p of pl){
    if(p.broken)continue;
    if(x+w+hm<=p.x||x>=p.x+p.w+hm)continue;
    let gap;
    if(p.y>=y+h)gap=p.y-(y+h);else if(y>=p.y+p.h)gap=y-(p.y+p.h);else gap=0;
    if(gap<minGap)return false;
  }
  return true;
}
const UNSAFE_RESPAWN=["cloud","break","spike","danger","freeze","fuel"];
function chooseRespawnTarget(pl,lastStood,lastStoodY){
  if(lastStood&&pl.includes(lastStood)&&!lastStood.broken&&!UNSAFE_RESPAWN.includes(lastStood.type))return lastStood;
  if(lastStoodY!==null){
    const sa=pl.filter(p=>!p.broken&&!UNSAFE_RESPAWN.includes(p.type)&&p.y<lastStoodY-5);
    if(sa.length)return sa.reduce((a,b)=>a.y>b.y?a:b);
    const all=pl.filter(p=>!p.broken&&!UNSAFE_RESPAWN.includes(p.type));
    if(all.length)return all.reduce((a,b)=>a.y>b.y?a:b);
    return null;
  }
  const all=pl.filter(p=>!p.broken&&!UNSAFE_RESPAWN.includes(p.type));
  if(!all.length)return null;
  return all.reduce((a,b)=>a.y>b.y?a:b);
}

function RunScene(levelNum){
  this.levelNum=levelNum;
  this.cfg=LEVEL_CONFIG[levelNum]||LEVEL_CONFIG[1];
  this.init();
}
RunScene.prototype.init=function(){
  const c=this.cfg;
  this.t=0;
  this.targetScore=c.target;
  this.gapMult=c.gap||1;
  this.breakChance=c.brk||0;
  this.cloudChance=c.cloud||0;
  this.springChance=c.spring||0;
  this.freezeChance=c.freeze!==undefined?c.freeze:0;
  this.levelFreezeReplaceChance=c.freezeRep!==undefined?c.freezeRep:0;
  this.dangerBonus=c.db||0;
  this.spikeBonus=c.sb||0;
  this.infiniteMode=!!c.infinite;
  this.tBrk=!!c.tBrk;this.tCloud=!!c.tCloud;this.tSpring=!!c.tSpring;
  this.tFreeze=!!c.tFreeze;this.tDanger=!!c.tDanger;this.tMoving=!!c.tMoving;this.tSpike=!!c.tSpike;

  if(this.levelNum>=LEVEL_INTRO_FREEZE&&c.freeze===undefined)this.freezeChance=INFINITE_FREEZE_CHANCE;
  if(this.levelNum>=LEVEL_INTRO_FREEZE_REPLACE&&c.freezeRep===undefined)this.levelFreezeReplaceChance=FREEZE_REPLACE_CHANCE;
  this.spikeActive=this.levelNum>=LEVEL_INTRO_SPIKE;
  this.movingActive=this.levelNum>=LEVEL_INTRO_MOVING;
  this.dangerActive=this.levelNum>=LEVEL_INTRO_DANGER;

  this.frog=new Frog();this.score=0;
  const startW=(this.levelNum===16||this.levelNum===22)?200:100;
  this.platforms=[new Platform(W/2-startW/2,H-100,"normal")];
  this.platforms[0].w=startW;
  this.nextGapReduced=false;this.nextMustBeNormal=false;

  const self=this;
  this.addWithCloudSupport=function(x,y,type){
    if(type==="moving"){
      const need=MOVING_RANGE_MAX,avail=W-70;
      if(avail<2*need)self.platforms.push(new Platform(x,y,"normal"));
      else{
        const base=randInt(need,avail-need),mr=randInt(MOVING_RANGE_MIN,MOVING_RANGE_MAX);
        const np=new Platform(x,y,"moving",movingSpeedMult(self.score));
        np.baseX=base;np.moveRange=mr;
        np.movePhase=choice([Math.PI*0.3,Math.PI*0.7,Math.PI*1.3,Math.PI*1.7]);
        const f=triangleFrac(np.movePhase);np.x=np.baseX+(f*2-1)*np.moveRange;np.prevX=np.x;
        self.platforms.push(np);
      }
    }else self.platforms.push(new Platform(x,y,type));
    if(type==="cloud"){
      let sx=x+90;if(sx+70>W)sx=x-90;if(sx<0)sx=0;
      self.platforms.push(new Platform(sx,y,"normal"));
    }
  };
  this.randomType=function(){
    if(self.levelNum===6)return ["break",false];
    if(self.infiniteMode){
      if(Math.random()<freezeReplaceChance(self.score))return ["freeze",true];
      if(self.score>=MOVING_START_SCORE&&Math.random()<MOVING_REPLACE_CHANCE)return ["moving",false];
      const r=Math.random();
      if(r<self.cloudChance)return ["cloud",false];
      if(r<self.cloudChance+self.breakChance)return ["break",false];
      if(r<self.cloudChance+self.breakChance+self.springChance)return ["spring",false];
      return ["normal",false];
    }else{
      if(self.levelFreezeReplaceChance>0&&Math.random()<self.levelFreezeReplaceChance)return ["freeze",true];
      if(self.movingActive&&Math.random()<MOVING_REPLACE_CHANCE)return ["moving",false];
      const r=Math.random();
      if(r<self.cloudChance)return ["cloud",false];
      if(r<self.cloudChance+self.breakChance)return ["break",false];
      if(r<self.cloudChance+self.breakChance+self.springChance)return ["spring",false];
      return ["normal",false];
    }
  };

  const addTutorialFill=()=>{
    for(let i=0;i<7;i++){const y=H-310-i*70,x=randInt(0,W-70);const [type]=self.randomType();self.addWithCloudSupport(x,y,type);}
  };
  if(this.tBrk){
    this.platforms.push(new Platform(W/2-35,H-230,"break"));
    for(let i=0;i<7;i++){const y=H-310-i*70,x=randInt(0,W-70);const type=Math.random()<this.breakChance?"break":"normal";this.platforms.push(new Platform(x,y,type));}
  }else if(this.tCloud){
    const cx=W/2-35,cy=H-230;
    this.platforms.push(new Platform(cx,cy,"cloud"));
    const opts=[];if(cx-90>=0)opts.push(cx-90);if(cx+160<=W)opts.push(cx+90);
    const sx=opts.length?choice(opts):Math.max(0,Math.min(W-70,cx+90));
    this.platforms.push(new Platform(sx,cy,"normal"));
    addTutorialFill();
  }else if(this.tSpring){
    const sp=new Platform(W/2-35,H-230,"spring");sp.springX=Math.floor((sp.w-sp.springW)/2);this.platforms.push(sp);
    addTutorialFill();
  }else if(this.tFreeze){
    this.platforms.push(new Platform(W/2-35,H-230,"freeze"));addTutorialFill();
  }else if(this.tDanger){
    this.platforms.push(new Platform(W/2-35,H-230,"danger"));
    const opts=[];const l=W/2-35-90;if(l>=0)opts.push(l);const r=W/2-35+160;if(r+70<=W)opts.push(r);
    const sx=opts.length?choice(opts):Math.max(0,Math.min(W-70,W/2-35+90));
    this.platforms.push(new Platform(sx,H-230,"normal"));addTutorialFill();
  }else if(this.tMoving){
    const base=(W-70)/2;
    const mp=new Platform(base,H-230,"moving",1.0);
    mp.baseX=base;mp.moveRange=base;mp.movePhase=0;mp.moveSpeed=BASE_MOVING_SPEED;
    const f=triangleFrac(mp.movePhase);mp.x=mp.baseX+(f*2-1)*mp.moveRange;mp.prevX=mp.x;
    this.platforms.push(mp);addTutorialFill();
  }else if(this.tSpike){
    this.platforms.push(new Platform(W/2-35,H-230,"spike"));
    const opts=[];const l=W/2-35-90;if(l>=0)opts.push(l);const r=W/2-35+160;if(r+70<=W)opts.push(r);
    const sx=opts.length?choice(opts):Math.max(0,Math.min(W-70,W/2-35+90));
    this.platforms.push(new Platform(sx,H-230,"normal"));addTutorialFill();
  }else{
    for(let i=0;i<8;i++){const y=H-180-i*70,x=randInt(0,W-70);const [type]=this.randomType();this.addWithCloudSupport(x,y,type);}
  }

  this.totalRise=0;this.startWorldY=H-130;
  this.respawnsLeft=MAX_RESPAWNS;
  this.lastSafeY=null;this.lastSafePlatform=null;
  const finishWorldY=this.startWorldY-this.targetScore/0.4+this.frog.h+25;
  this.finishPlat=new FinishPlatform(randInt(20,W-110),Math.floor(finishWorldY));
  this.platforms.push(this.finishPlat);

  this.bgClouds=[];for(let i=0;i<6;i++)this.bgClouds.push(new BackgroundCloud(this.bgClouds));

  this.paused=false;this.springLaunched=false;
  this.result=null;this.confetti=[];
  this.state="play";this.victoryTime=0;
  this.respawnTimeLeft=0;this.gameOverIsNew=false;
  this.pauseButtons=[
    new Button("Перезагрузить",W/2,H/2-10,240,50,[70,170,90]),
    new Button("Выйти к уровням",W/2,H/2+55,240,50,[90,130,200]),
    new Button("Выйти в меню",W/2,H/2+120,240,50,[200,80,100]),
  ];
};

RunScene.prototype.computeScore=function(fy,rise){return Math.max(0,Math.floor((this.startWorldY-(fy-rise))*0.4));};
RunScene.prototype.dangerChanceFor=function(){if(!this.dangerActive)return 0;if(this.infiniteMode)return dangerChance(this.score);return this.dangerBonus>0?this.dangerBonus:FLAT_DANGER_CHANCE;};
RunScene.prototype.spikeChanceFor=function(){if(!this.spikeActive)return 0;if(this.infiniteMode)return spikeChance(this.score);return this.spikeBonus>0?this.spikeBonus:FLAT_SPIKE_CHANCE;};

RunScene.prototype.spawnLevelPlatform=function(top){
  let mn,mx;
  if(this.infiniteMode){[mn,mx]=platformGapRange(this.score);}
  else{mn=Math.floor(65*this.gapMult);mx=Math.floor(85*this.gapMult);}
  if(this.nextGapReduced){mn=Math.floor(mn*0.45);mx=Math.floor(mx*0.55);mx=Math.min(mx,50);mn=Math.min(mn,mx-5);this.nextGapReduced=false;}
  const padX=40,padY=40;
  const fr={x:this.finishPlat.x-padX,y:this.finishPlat.y-padY,w:this.finishPlat.w+2*padX,h:this.finishPlat.h+2*padY};
  for(let k=0;k<30;k++){
    const y=top-randInt(mn,mx);
    if(y<=this.finishPlat.y+padY)return top;
    let x=randInt(0,W-70);
    if(x<fr.x+fr.w&&x+70>fr.x&&y<fr.y+fr.h&&y+15>fr.y){
      const lm=fr.x-70,rm=fr.x+fr.w,opts=[];
      if(lm>=0)opts.push([0,lm]);if(rm<=W-70)opts.push([rm,W-70]);
      if(!opts.length)return top;
      const [a,b]=choice(opts);x=randInt(a,b);
    }
    let type,wasReplace=false;
    if(this.nextMustBeNormal){type="normal";this.nextMustBeNormal=false;}
    else{[type,wasReplace]=this.randomType();}
    let mr=null,mb=null;
    if(type==="moving"){
      const need=MOVING_RANGE_MAX,avail=W-70;
      if(avail<2*need)type="normal";else{mb=randInt(need,avail-need);mr=randInt(MOVING_RANGE_MIN,MOVING_RANGE_MAX);}
    }
    const np=new Platform(x,y,type,movingSpeedMult(this.score));
    if(type==="moving"){np.baseX=mb;np.moveRange=mr;np.movePhase=choice([Math.PI*0.3,Math.PI*0.7,Math.PI*1.3,Math.PI*1.7]);const f=triangleFrac(np.movePhase);np.x=np.baseX+(f*2-1)*np.moveRange;np.prevX=np.x;}
    this.platforms.push(np);
    if(wasReplace){this.nextGapReduced=true;this.nextMustBeNormal=true;}
    if(type==="cloud"){
      let sx=x+90;if(sx+70>W)sx=x-90;if(sx<0)sx=0;
      if(!(sx<fr.x+fr.w&&sx+70>fr.x&&y<fr.y+fr.h&&y+15>fr.y))this.platforms.push(new Platform(sx,y,"normal"));
      else{let ax=x-90;if(ax<0)ax=0;if(!(ax<fr.x+fr.w&&ax+70>fr.x))this.platforms.push(new Platform(ax,y,"normal"));}
    }
    // freeze
    const doFrz=this.infiniteMode?(this.score>=2000&&Math.random()<0.18):(this.freezeChance>0&&Math.random()<this.freezeChance);
    if(doFrz){
      const sy=y-randInt(35,50);
      if(sy>this.finishPlat.y+padY){
        let sx=null;
        for(let t=0;t<20;t++){
          const cx=randInt(0,W-70);
          if(cx<fr.x+fr.w&&cx+70>fr.x&&sy<fr.y+fr.h&&sy+15>fr.y)continue;
          let ov=false;for(const p of this.platforms){if(p.broken)continue;if(!overlapsVertical(p,sy,15,4))continue;if(cx<p.x+p.w&&cx+70>p.x){ov=true;break;}}
          if(!ov){sx=cx;break;}
        }
        if(sx===null)sx=randInt(0,W-70);
        this.platforms.push(new Platform(sx,sy,"freeze"));
      }
    }
    // danger
    const dC=this.dangerChanceFor();
    if(dC>0&&countType(this.platforms,"danger")<MAX_DANGER_PLATFORMS&&Math.random()<dC){
      const sy=y-randInt(35,50);
      if(sy>this.finishPlat.y+padY){
        let dx=null;
        for(let t=0;t<20;t++){
          const cx=randInt(0,W-70);
          if(cx<fr.x+fr.w&&cx+70>fr.x&&sy<fr.y+fr.h&&sy+15>fr.y)continue;
          let ov=false;for(const p of this.platforms){if(p.broken)continue;if(!overlapsVertical(p,sy,15,DANGER_SAFE_GAP))continue;if(cx<p.x+p.w&&cx+70>p.x){ov=true;break;}}
          if(!ov&&isDangerSafe(cx,sy,this.platforms)){dx=cx;break;}
        }
        if(dx!==null)this.platforms.push(new Platform(dx,sy,"danger"));
      }
    }
    // spike
    if(this.spikeActive){
      const sC=this.spikeChanceFor();
      if(sC>0&&countType(this.platforms,"spike")<MAX_DANGER_PLATFORMS&&Math.random()<sC){
        const sy=y-randInt(35,50);
        if(sy>this.finishPlat.y+padY){
          let sx=null;
          for(let t=0;t<20;t++){
            const cx=randInt(0,W-70);
            if(cx<fr.x+fr.w&&cx+70>fr.x&&sy<fr.y+fr.h&&sy+15>fr.y)continue;
            let ov=false;for(const p of this.platforms){if(p.broken)continue;if(!overlapsVertical(p,sy,15,DANGER_SAFE_GAP))continue;if(cx<p.x+p.w&&cx+70>p.x){ov=true;break;}}
            if(!ov&&isDangerSafe(cx,sy,this.platforms)){sx=cx;break;}
          }
          if(sx!==null)this.platforms.push(new Platform(sx,sy,"spike"));
        }
      }
    }
    return y;
  }
  return top;
};

RunScene.prototype.keydown=function(e){
  if(e.code==="Escape"){
    if(this.state==="play"){this.paused=!this.paused;for(const b of this.pauseButtons)b.reset();}
    e.preventDefault();
  }else if((e.code==="KeyR"||e.code==="KeyK")&&!this.paused&&this.state==="play"){
    this.frog.activateAbility();
  }
};

RunScene.prototype.update=function(dt){
  this.t+=dt/1000;
  if(this.state==="victory"){
    this.victoryTime+=dt/1000;
    updateConfetti(this.confetti,dt);
    if(this.victoryTime>0.5){
      if(consumeKey("Space")){
        const nx=this.levelNum+1;
        if(nx<=WORKING_LEVELS)this.result={type:"next",level:nx};else this.result="menu";
      }
      if(consumeKey("Escape"))this.result="menu";
      if(consumeKey("KeyQ"))this.result="levels";
    }
    return;
  }
  if(this.state==="gameover"){
    updateConfetti(this.confetti,dt);
    if(consumeKey("Space")){this.result="retry";return;}
    if(consumeKey("Escape")){this.result="menu";return;}
    if(consumeKey("KeyQ")){this.result="levels";return;}
    return;
  }
  if(this.state==="respawn"){
    this.respawnTimeLeft-=dt/1000;
    if(this.respawnTimeLeft<=0){this._toGameOver();return;}
    if(consumeKey("Space")){this._doRespawn();return;}
    if(consumeKey("Escape")){this._toGameOver();return;}
    return;
  }
  if(this.paused){
    if(consumeKey("KeyR")){this.result="retry";return;}
    for(const b of this.pauseButtons)b.update(dt);
    if(this.pauseButtons[0].clicked){this.result="retry";return;}
    if(this.pauseButtons[1].clicked){this.result="levels";return;}
    if(this.pauseButtons[2].clicked){this.result="menu";return;}
    return;
  }
  this._updatePlay(dt);
};
RunScene.prototype._toGameOver=function(){
  this.state="gameover";this.gameOverIsNew=this.score>highScore;
  if(this.score>highScore){highScore=this.score;saveInt(HS_KEY,highScore);}
  if(this.gameOverIsNew)spawnConfetti(this.confetti,W/2,H/2,90);
};
RunScene.prototype._doRespawn=function(){
  this.respawnsLeft--;
  this.frog=new Frog();
  const t=chooseRespawnTarget(this.platforms,this.lastSafePlatform,this.lastSafeY);
  if(t){this.frog.x=t.x+t.w/2-this.frog.w/2;this.frog.y=t.y-this.frog.h-2;this.frog.vy=0;this.frog.standingPlatform=t;this.frog.standingOffsetX=this.frog.x-t.x;}
  this.springLaunched=false;this.state="play";
};

RunScene.prototype._updatePlay=function(dt){
  const frog=this.frog;
  if(frog.dying){
    frog.updateDeath(dt);frog.deathTimer-=dt;
    for(const c of this.bgClouds)c.update(0,this.bgClouds);
    if(frog.deathTimer<=0){
      if(this.respawnsLeft>0){this.state="respawn";this.respawnTimeLeft=5;}
      else this._toGameOver();
    }
    return;
  }
  frog.updateTimers(dt);
  for(const p of this.platforms)p.update(dt);

  let onMoving=false;
  if(frog.standingPlatform!==null){
    const sp=frog.standingPlatform;
    if(!this.platforms.includes(sp)||sp.broken){frog.standingPlatform=null;frog.standingOffsetX=0;}
    else if(sp.type==="moving")onMoving=true;
  }
  if(onMoving){
    const sp=frog.standingPlatform;
    const speed=frog.freezeTimer>0?5/1.3:5;
    if(keys.left)frog.standingOffsetX-=speed;
    if(keys.right)frog.standingOffsetX+=speed;
    const minOff=-frog.w+4,maxOff=sp.w-4;
    if(frog.standingOffsetX<minOff||frog.standingOffsetX>maxOff){
      frog.x=sp.x+frog.standingOffsetX;frog.standingPlatform=null;frog.standingOffsetX=0;onMoving=false;frog.move();
    }else{
      frog.x=sp.x+frog.standingOffsetX;frog.y=sp.y-frog.h;frog.vy=0;
      if(keys.jump){frog.jump();onMoving=false;}
    }
  }else frog.move();

  const wDown=keys.jump;
  let onPlat=false,isDead=false,deathKind=null,deathFrom=null;
  const fRect={x:frog.x,y:frog.y,w:frog.w,h:frog.h};

  if(!this.springLaunched){
    for(const p of this.platforms){
      if(p.broken)continue;
      if(p.type==="danger"){
        const R=RING_OFFSET;
        if(rectsOverlap(fRect,{x:p.x-R,y:p.y-R,w:p.w+2*R,h:p.h+2*R})){isDead=true;deathKind="electric";break;}
      }else if(p.type==="spike"){
        if(rectsOverlap(fRect,{x:p.x,y:p.y-(SPIKE_H-1),w:p.w,h:SPIKE_H})||rectsOverlap(fRect,{x:p.x,y:p.y+p.h-1,w:p.w,h:SPIKE_H})){
          isDead=true;deathKind="spike";deathFrom=[p.x+p.w/2,p.y+p.h/2];break;
        }
      }
    }
  }
  if(isDead){frog.startDeath(deathKind||"electric",deathFrom);this.springLaunched=false;return;}

  if(!onMoving){
    frog.standingPlatform=null;
    if(frog.vy>=0){
      for(const p of this.platforms){
        if(p.broken)continue;
        if(p.type==="spike"||p.type==="danger")continue;
        const pr={x:p.x,y:p.y,w:p.w,h:p.h};
        if(rectsOverlap(fRect,pr)&&frog.y+frog.h-frog.vy<=p.y+8){
          if(p.type==="finish"){
            const finalScore=Math.max(0,Math.min(this.score,this.targetScore));
            const done=loadProgress();
            if(this.levelNum>done)saveProgress(this.levelNum);
            this.state="victory";this.victoryTime=0;
            spawnConfetti(this.confetti,this.finishPlat.x+this.finishPlat.w/2,this.finishPlat.y+this.finishPlat.h/2,110);
            return;
          }
          if(p.type==="cloud"){p.broken=true;p.spawnParticles();break;}
          frog.y=p.y-frog.h;frog.vy=0;onPlat=true;frog.standingPlatform=p;
          if(!["cloud","break","freeze","fuel"].includes(p.type)){this.lastSafePlatform=p;this.lastSafeY=p.y;}
          let onSpring=false;
          if(p.type==="spring"&&rectsOverlap(fRect,p.springHitRect())){onSpring=true;p.springAnim=1;}
          if(p.type==="spring"&&onSpring){if(frog.springTimer===0){frog.springTimer=200;frog.springPlatform=p;this.springLaunched=true;}}
          else{if(frog.springTimer<=0)this.springLaunched=false;}
          if(p.type==="moving")frog.standingOffsetX=frog.x-p.x;
          if(p.type==="break")p.isStepped=true;
          if(p.type==="freeze")frog.freezeTimer=1000;
          if(wDown&&!(p.type==="spring"&&onSpring)){frog.jump();if(frog.abilityActive)frog.jumpsLeft=1;}
          break;
        }
      }
    }
  }
  if(wDown&&frog.abilityActive&&frog.jumpsLeft>0&&!onPlat&&frog.vy>-2){frog.jump();frog.jumpsLeft--;}

  let dy=0;
  if(this.score<this.targetScore&&frog.y<H/2){
    dy=Math.floor((H/2-frog.y)*0.1);frog.y+=dy;this.totalRise+=dy;
    for(const p of this.platforms)p.y+=dy;
  }
  const cur=this.computeScore(frog.y,this.totalRise);
  if(cur>this.score)this.score=cur;
  if(this.score>this.targetScore)this.score=this.targetScore;
  for(const c of this.bgClouds)c.update(dy,this.bgClouds);

  let top=Math.min(...this.platforms.filter(pl=>!((pl.type==="break"&&pl.broken)||(pl.type==="cloud"&&pl.broken)||pl.type==="finish")).map(pl=>pl.y),-100);
  for(let i=this.platforms.length-1;i>=0;i--){
    const p=this.platforms[i];
    if(p.type==="finish")continue;
    if(p.y>H+20){this.platforms.splice(i,1);top=this.spawnLevelPlatform(top);continue;}
    if(p.type==="cloud"&&p.broken&&p.particles.length===0){this.platforms.splice(i,1);top=this.spawnLevelPlatform(top);continue;}
    if(p.type==="break"&&p.broken&&p.alpha<=0){this.platforms.splice(i,1);top=this.spawnLevelPlatform(top);continue;}
  }
  if(frog.y>H&&!frog.dying){frog.startDeath("fall");this.springLaunched=false;}
};

function MinigameScene(mode){
  this.mode=mode;this.isDark=mode==="dark";this.isLava=mode==="lava";this.isVanish=mode==="vanish";
  this.init();
}
MinigameScene.prototype.init=function(){
  this.t=0;
  this.frog=new Frog();this.frog.x=W/2-15;this.frog.y=H-130;
  this.frog.hasLamp=this.isDark;this.frog.lampFuelSeconds=MG_DARK_FUEL_SECONDS;
  this.platforms=[new Platform(W/2-50,H-100,"normal")];this.platforms[0].w=100;
  for(let i=0;i<8;i++)this.platforms.push(new Platform(randInt(0,W-70),H-180-i*70,"normal"));
  this.bgClouds=[];if(!this.isDark)for(let i=0;i<6;i++)this.bgClouds.push(new BackgroundCloud(this.bgClouds));
  this.lavaY=H+20;this.lavaElapsed=0;this.lavaMult=MG_LAVA_START_MULT;
  this.vanished=new Set();
  this.nextFuelAt=randInt(MG_DARK_REFUEL_MIN_GAP,MG_DARK_REFUEL_MAX_GAP);
  this.score=0;this.paused=false;this.respawnsLeft=MAX_RESPAWNS;
  this.lastStood=null;this.lastStoodY=null;this.springLaunched=false;
  this.mgHS=loadMinigameHS(this.mode);this.recordAtStart=this.mgHS;
  this.state="play";this.respawnTimeLeft=0;this.gameOverIsNew=false;
  this.result=null;
  this.pauseButtons=[
    new Button("Заново",W/2,H/2-30,240,52,[70,170,90]),
    new Button("Выйти в меню",W/2,H/2+40,240,52,[200,80,100]),
  ];
};
MinigameScene.prototype.keydown=function(e){
  if(e.code==="Escape"){
    if(this.state==="play"){this.paused=!this.paused;for(const b of this.pauseButtons)b.reset();}
    e.preventDefault();
  }else if((e.code==="KeyR"||e.code==="KeyK")&&!this.paused&&this.state==="play"){
    this.frog.activateAbility();
  }
};
MinigameScene.prototype.spawnPlat=function(){
  const alive=this.platforms.filter(p=>!((p.type==="break"&&p.broken)||(p.type==="cloud"&&p.broken)));
  if(!alive.length){const y=H-200;this.platforms.push(new Platform(randInt(0,W-70),y,"normal"));return;}
  const top=Math.min(...alive.map(p=>p.y));
  const [mn,mx]=platformGapRange(this.score);
  const y=top-randInt(mn,mx);
  this.platforms.push(new Platform(randInt(0,W-70),y,"normal"));
};
MinigameScene.prototype._toGameOver=function(){
  this.state="gameover";this.gameOverIsNew=this.score>this.recordAtStart;
  if(this.score>this.mgHS){this.mgHS=this.score;saveMinigameHS(this.mode,this.mgHS);}
};
MinigameScene.prototype._doRespawn=function(){
  this.respawnsLeft--;this.frog=new Frog();
  this.frog.hasLamp=this.isDark;this.frog.lampFuelSeconds=MG_DARK_FUEL_SECONDS;
  const t=chooseRespawnTarget(this.platforms,this.lastStood,this.lastStoodY);
  if(t){this.frog.x=t.x+t.w/2-this.frog.w/2;this.frog.y=t.y-this.frog.h-2;this.frog.vy=0;this.frog.standingPlatform=t;this.frog.standingOffsetX=this.frog.x-t.x;}
  this.springLaunched=false;
  if(this.isLava&&t){const sl=t.y+t.h+120;if(this.lavaY<sl)this.lavaY=sl;}
  this.nextFuelAt=this.score+randInt(MG_DARK_REFUEL_MIN_GAP,MG_DARK_REFUEL_MAX_GAP);

};
MinigameScene.prototype.update=function(dt){
  this.t+=dt/1000;
  if(this.state==="gameover"){
    if(consumeKey("Space")){this.result="retry";return;}
    if(consumeKey("Escape")){this.result="menu";return;}
    return;
  }
  if(this.state==="respawn"){
    this.respawnTimeLeft-=dt/1000;
    if(this.respawnTimeLeft<=0){this._toGameOver();return;}
    if(consumeKey("Space")){this._doRespawn();return;}
    if(consumeKey("Escape")){this._toGameOver();return;}
    return;
  }
  if(this.paused){
    if(consumeKey("KeyR")){this.result="retry";return;}
    for(const b of this.pauseButtons)b.update(dt);
    if(this.pauseButtons[0].clicked){this.result="retry";return;}
    if(this.pauseButtons[1].clicked){this.result="menu";return;}
    return;
  }
  this._updatePlay(dt);
};
MinigameScene.prototype._updatePlay=function(dt){
  const frog=this.frog;
  if(frog.dying){
    frog.updateDeath(dt);frog.deathTimer-=dt;
    if(frog.deathTimer<=0){
      if(this.respawnsLeft>0){this.state="respawn";this.respawnTimeLeft=5;}
      else this._toGameOver();
    }
    return;
  }
  frog.updateTimers(dt);
  for(const p of this.platforms)p.update(dt);

    this.lavaElapsed+=dt;
    const prog=Math.min(1,this.lavaElapsed/MG_LAVA_RAMP_MS);
    this.lavaMult=MG_LAVA_START_MULT+(MG_LAVA_MAX_MULT-MG_LAVA_START_MULT)*prog;

  }
  if(this.isDark)frog.lampFuelSeconds=Math.max(0,frog.lampFuelSeconds-dt/1000);
  if(this.isVanish){
    for(const p of this.platforms){
      if(p.vanishFade===null||p.vanishFade===undefined)continue;
      p.vanishFade-=dt*255/MG_VANISH_DELAY_MS;
      p.alpha=Math.max(0,Math.floor(p.vanishFade));
      if(p.vanishFade<=0){this.vanished.add(p);p.vanishFade=null;}
    }
  }
  let onMoving=false;
  if(frog.standingPlatform!==null){
    const sp=frog.standingPlatform;
    if(!this.platforms.includes(sp)||sp.broken){frog.standingPlatform=null;frog.standingOffsetX=0;}
    else if(sp.type==="moving")onMoving=true;
  }
  if(onMoving){
    const sp=frog.standingPlatform,speed=frog.freezeTimer>0?5/1.3:5;
    if(keys.left)frog.standingOffsetX-=speed;
    if(keys.right)frog.standingOffsetX+=speed;
    const minOff=-frog.w+4,maxOff=sp.w-4;
    if(frog.standingOffsetX<minOff||frog.standingOffsetX>maxOff){frog.x=sp.x+frog.standingOffsetX;frog.standingPlatform=null;frog.standingOffsetX=0;onMoving=false;frog.move();}
    else{frog.x=sp.x+frog.standingOffsetX;frog.y=sp.y-frog.h;frog.vy=0;if(keys.jump){frog.jump();onMoving=false;}}
  }else frog.move();
  const wDown=keys.jump;
  let onPlat=false,isDead=false,deathKind=null,deathFrom=null;
  const fRect={x:frog.x,y:frog.y,w:frog.w,h:frog.h};
  if(!this.springLaunched){
    for(const p of this.platforms){
      if(p.broken)continue;
      if(p.type==="danger"){
        const R=RING_OFFSET;
        if(rectsOverlap(fRect,{x:p.x-R,y:p.y-R,w:p.w+2*R,h:p.h+2*R})){isDead=true;deathKind="electric";break;}
      }else if(p.type==="spike"){
        if(rectsOverlap(fRect,{x:p.x,y:p.y-(SPIKE_H-1),w:p.w,h:SPIKE_H})||rectsOverlap(fRect,{x:p.x,y:p.y+p.h-1,w:p.w,h:SPIKE_H})){
          isDead=true;deathKind="spike";deathFrom=[p.x+p.w/2,p.y+p.h/2];break;
        }
      }
    }
  }
  if(this.isLava&&!isDead&&frog.y+frog.h>=this.lavaY){isDead=true;deathKind="spike";deathFrom=[frog.x+frog.w/2,this.lavaY];}
  if(isDead){frog.startDeath(deathKind||"electric",deathFrom);this.springLaunched=false;return;}
  if(!onMoving){
    frog.standingPlatform=null;
    if(frog.vy>=0){
      for(const p of this.platforms){
        if(p.broken)continue;
        if(p.type==="spike"||p.type==="danger")continue;
        const pr={x:p.x,y:p.y,w:p.w,h:p.h};
        if(rectsOverlap(fRect,pr)&&frog.y+frog.h-frog.vy<=p.y+8){
          if(p.type==="cloud"){p.broken=true;p.spawnParticles();break;}
          frog.y=p.y-frog.h;frog.vy=0;onPlat=true;frog.standingPlatform=p;
          if(p.type==="fuel"&&!p.fuelTaken){p.fuelTaken=true;frog.lampFuelSeconds=Math.min(MG_DARK_FUEL_SECONDS,frog.lampFuelSeconds+MG_DARK_REFUEL_SECONDS);}
          if(!["cloud","break","freeze","fuel"].includes(p.type)){this.lastStood=p;this.lastStoodY=p.y;}
          let onSpring=false;
          if(p.type==="spring"&&rectsOverlap(fRect,p.springHitRect())){onSpring=true;p.springAnim=1;}
          if(p.type==="spring"&&onSpring){if(frog.springTimer===0){frog.springTimer=200;frog.springPlatform=p;this.springLaunched=true;}}
          else{if(frog.springTimer<=0)this.springLaunched=false;}
          if(p.type==="moving")frog.standingOffsetX=frog.x-p.x;
          if(p.type==="break")p.isStepped=true;
          if(p.type==="freeze")frog.freezeTimer=1000;
          if(this.isVanish&&p.type!=="break"&&(p.vanishFade===null||p.vanishFade===undefined))p.vanishFade=255;
          if(wDown&&!(p.type==="spring"&&onSpring)){frog.jump();if(frog.abilityActive)frog.jumpsLeft=1;}
          break;
        }
      }
    }
  }
  if(wDown&&frog.abilityActive&&frog.jumpsLeft>0&&!onPlat&&frog.vy>-2){frog.jump();frog.jumpsLeft--;}
  let dy=0;
  if(frog.y<H/2){
    dy=Math.floor((H/2-frog.y)*0.1);frog.y+=dy;this.score+=Math.floor(dy*0.4);
    if(this.score>this.mgHS){this.mgHS=this.score;saveMinigameHS(this.mode,this.mgHS);}
    for(const p of this.platforms)p.y+=dy;
    if(this.isLava)this.lavaY+=dy;
  }
  if(this.isDark&&this.score>=this.nextFuelAt){
    let top=Math.min(...this.platforms.filter(p=>!((p.type==="break"&&p.broken)||(p.type==="cloud"&&p.broken))).map(p=>p.y),H-400);
    const fy=top-randInt(35,50);
    const fx=findFreeX(this.platforms,fy,70,15,40,DANGER_SAFE_GAP);
    if(fx!==null&&isDangerSafe(fx,fy,this.platforms)&&countType(this.platforms,"fuel")<MAX_DANGER_PLATFORMS)this.platforms.push(new Platform(fx,fy,"fuel"));
    this.nextFuelAt=this.score+randInt(MG_DARK_REFUEL_MIN_GAP,MG_DARK_REFUEL_MAX_GAP);
  }
  for(const c of this.bgClouds)c.update(dy,this.bgClouds);
  let need=false;
  for(let i=this.platforms.length-1;i>=0;i--){
    const p=this.platforms[i];
    if(p.y>H+20){this.platforms.splice(i,1);need=true;continue;}
    if(p.type==="cloud"&&p.broken&&p.particles.length===0){this.platforms.splice(i,1);need=true;continue;}
    if(p.type==="break"&&p.broken&&p.alpha<=0){this.platforms.splice(i,1);need=true;continue;}
    if(this.isVanish&&this.vanished.has(p)){this.platforms.splice(i,1);need=true;continue;}
  }
  if(need)this.spawnPlat();
  if(frog.y>H&&!frog.dying){frog.startDeath("fall");this.springLaunched=false;}
};

MinigameScene.prototype._drawWorld=function(){
  ctx.fillStyle=this.isDark?"rgb(10,12,26)":rgb(BG);ctx.fillRect(0,0,W,H);
  if(!this.isDark){drawSun();for(const c of this.bgClouds)c.draw();}
  for(const p of this.platforms){
    if(this.isLava&&!this.isDark&&p.y>this.lavaY-4)continue;
    if(this.isVanish&&p.vanishFade!==null&&p.vanishFade!==undefined){
      ctx.globalAlpha=clamp(p.vanishFade/255,0,1);p.draw();ctx.globalAlpha=1;
    }else p.draw();
  }
  this.frog.draw();
  if(this.isLava){
    const top=this.lavaY|0;
    fillRect(0,top,W,H-top,"rgba(220,60,20,0.92)");
    fillRect(0,top,W,6,"rgb(255,140,30)");
    const tt=now()*0.002;
    for(let i=0;i<12;i++){const bx=(i*53+Math.floor(tt*30))%W;const by=top+10+Math.floor(8*Math.sin(tt*2+i));circle(bx,by,3,"rgba(255,200,80,0.78)");}
  }
  if(this.isDark){
    const fuel=clamp(this.frog.lampFuelSeconds/MG_DARK_FUEL_SECONDS,0,1);
    if(fuel>0){
      const [lcx,lcy]=this.frog.getLampPos();
      const radius=MG_DARK_MIN_RADIUS+(MG_DARK_FUEL_FULL_RADIUS-MG_DARK_MIN_RADIUS)*fuel;
      const t=now()*0.004;
      const rw=radius*(1+0.035*Math.sin(t*1.6));
      // радиальный градиент от прозрачного к чёрному
      const g=ctx.createRadialGradient(lcx,lcy,rw*0.5,lcx,lcy,rw);
      g.addColorStop(0,"rgba(0,0,0,0)");
      g.addColorStop(0.7,"rgba(0,0,0,0.5)");
      g.addColorStop(1,"rgba(0,0,0,0.93)");
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // заполняем всё, что вне круга, полностью чёрным
      ctx.beginPath();
      ctx.rect(0,0,W,H);
      ctx.arc(lcx,lcy,rw,0,Math.PI*2,true);
      ctx.fillStyle="rgba(0,0,0,0.93)";
      ctx.fill("evenodd");
    }else{
      ctx.fillStyle="rgba(0,0,0,0.96)";ctx.fillRect(0,0,W,H);
    }
    drawStarField(getStars(),now()*0.001);
    drawMoon();
  }
};

/* ======================== УПРАВЛЕНИЕ СЦЕНАМИ ======================== */
function goTo(sc){sceneStack.push(sc);currentScene=sc;}

function updateMain(dt){
  const sc=currentScene;if(!sc)return;

  if(sc instanceof MenuScene){
    if(sc.buttons[0].clicked){sc.buttons[0].clicked=false;goTo(new RunScene(0));return;}
    if(sc.buttons[1].clicked){sc.buttons[1].clicked=false;goTo(new LevelsScene());return;}
    if(sc.buttons[2].clicked){sc.buttons[2].clicked=false;goTo(new MinigamesMenuScene());return;}
    if(sc.buttons[3].clicked){sc.buttons[3].clicked=false;return;}
    if(sc.buttons[4].clicked){sc.buttons[4].clicked=false;return;}
    if(sc.howTo.clicked){sc.howTo.clicked=false;goTo(new HowToScene());return;}
    if(consumeKey("Escape")){return;}
  }
  if(sc instanceof HowToScene){
    if(consumeKey("Escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
  }
  if(sc instanceof LevelsScene){
    if(consumeKey("Escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
    if(consumeKey("ArrowLeft")&&sc.page>0){sc.page--;for(const b of sc.buttons)b.reset();}
    if(consumeKey("ArrowRight")&&sc.page<sc.totalPages-1){sc.page++;for(const b of sc.buttons)b.reset();}
    for(let i=0;i<sc.buttons.length;i++){
      if(sc.buttons[i].clicked){
        sc.buttons[i].clicked=false;
        const n=sc.page*sc.perPage+i+1,completed=loadProgress(),unlocked=Math.min(WORKING_LEVELS,completed+1);
        if(n<=WORKING_LEVELS&&n<=unlocked){goTo(new RunScene(n));return;}
      }
    }
  }
  if(sc instanceof MinigamesMenuScene){
    if(consumeKey("Escape")){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
    for(let i=0;i<sc.buttons.length;i++)if(sc.buttons[i].clicked){sc.buttons[i].clicked=false;goTo(new MinigameScene(["lava","dark","vanish"][i]));return;}
    if(sc.back.clicked){sc.back.clicked=false;sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];return;}
  }
  if(sc instanceof RunScene){
    if(sc.result){
      const r=sc.result;
      if(r==="retry"){sceneStack[sceneStack.length-1]=new RunScene(sc.levelNum);currentScene=sceneStack[sceneStack.length-1];}
      else if(r==="levels"){sceneStack.pop();if(!(sceneStack[sceneStack.length-1] instanceof LevelsScene))sceneStack.push(new LevelsScene());currentScene=sceneStack[sceneStack.length-1];}
      else if(r==="menu"){sceneStack.length=0;sceneStack.push(new MenuScene());currentScene=sceneStack[0];}
      else if(typeof r==="object"&&r.type==="next"){sceneStack[sceneStack.length-1]=new RunScene(r.level);currentScene=sceneStack[sceneStack.length-1];}
      return;
    }
  }
  if(sc instanceof MinigameScene){
    if(sc.result){
      const r=sc.result;
      if(r==="retry"){sceneStack[sceneStack.length-1]=new MinigameScene(sc.mode);currentScene=sceneStack[sceneStack.length-1];}
      else if(r==="menu"){sceneStack.pop();currentScene=sceneStack[sceneStack.length-1];}
      return;
    }
  }
  sc.update(dt);
}

/* ======================== ГЛАВНЫЙ ЦИКЛ — ФИКСИРОВАННЫЙ 60 FPS ======================== */
const FRAME_MS = 1000/60;   // 16.666...
let _lastTime = 0;
let _accum = 0;

function loop(ts){
  if(_lastTime === 0) _lastTime = ts;
  let frameDt = ts - _lastTime;
  _lastTime = ts;
  if(frameDt > 250) frameDt = 250;   // защита от табов
  _accum += frameDt;
  let steps = 0;
  while(_accum >= FRAME_MS && steps < 5){
    updateMain(FRAME_MS);
    _accum -= FRAME_MS;
    steps++;
  }
  if(currentScene) currentScene.draw();
  requestAnimationFrame(loop);
}

/* ======================== СТАРТ ======================== */
sceneStack.push(new MenuScene());
currentScene = sceneStack[0];
requestAnimationFrame(loop);
</script>
